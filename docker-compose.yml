services:
  mongodb:
    image: mongo:7
    container_name: techfeed-mongodb
    ports:
      - '3101:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: techfeed
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.1
    container_name: techfeed-elasticsearch
    ports:
      - '3102:9200'
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: techfeed-redis
    ports:
      - '3103:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: techfeed-postgres
    ports:
      - '3104:5432'
    environment:
      POSTGRES_DB: techfeed
      POSTGRES_USER: techfeed
      POSTGRES_PASSWORD: techfeed_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U techfeed']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: techfeed-api
    ports:
      - '3100:3100'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      elasticsearch:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  crawler:
    build:
      context: ./apps/crawler
      dockerfile: Dockerfile
    container_name: techfeed-crawler
    env_file:
      - .env
    depends_on:
      - mongodb
      - elasticsearch
      - redis
    restart: unless-stopped

volumes:
  mongodb_data:
  elasticsearch_data:
  redis_data:
  postgres_data:
