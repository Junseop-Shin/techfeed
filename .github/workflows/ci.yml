name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  typecheck-api:
    name: TypeScript Build (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: cd apps/api && npm ci --legacy-peer-deps

      - name: Build
        run: cd apps/api && npm run build

  typecheck-crawler:
    name: TypeScript Build (Crawler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/crawler/package-lock.json

      - name: Install dependencies
        run: cd apps/crawler && npm ci --legacy-peer-deps

      - name: Build
        run: cd apps/crawler && npm run build
