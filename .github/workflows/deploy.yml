name: Deploy to Home Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Write .env file on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          cat > /tmp/techfeed.env << 'EOF'
          NODE_ENV=production
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          ELASTICSEARCH_URL=${{ secrets.ELASTICSEARCH_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY="${{ secrets.FIREBASE_PRIVATE_KEY }}"
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          MONITOR_INGESTOR_URL=https://ingestor.nuclearbomb6518.com
          EOF
          ssh -i ~/.ssh/id_deploy \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "powershell -NoProfile -Command \"New-Item -ItemType Directory -Force -Path 'C:/Users/${{ secrets.DEPLOY_USER }}/Projects/techfeed' | Out-Null\""
          scp -i ~/.ssh/id_deploy \
            -P ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            /tmp/techfeed.env \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:C:/Users/${{ secrets.DEPLOY_USER }}/Projects/techfeed/.env"

      - name: Sync source files
        run: |
          tar czf - \
            --exclude='.git' \
            --exclude='apps/api/node_modules' \
            --exclude='apps/crawler/node_modules' \
            --exclude='apps/mobile/node_modules' \
            --exclude='apps/api/dist' \
            . \
          | ssh -i ~/.ssh/id_deploy \
              -p ${{ secrets.DEPLOY_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "tar xzf - -C C:/Users/${{ secrets.DEPLOY_USER }}/Projects/techfeed"

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/id_deploy \
            -p ${{ secrets.DEPLOY_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd C:/Users/${{ secrets.DEPLOY_USER }}/Projects/techfeed && docker compose up -d --build"

      - name: Wait for database readiness
        run: |
          for i in $(seq 1 15); do
            result=$(ssh -i ~/.ssh/id_deploy \
              -p ${{ secrets.DEPLOY_PORT }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "docker exec techfeed-postgres pg_isready -U techfeed" 2>&1) && echo "$result" && break
            echo "Waiting for postgres... ($i/15)"
            sleep 3
          done

      - name: Run database migrations
        run: |
          SSH_CMD="ssh -i ~/.ssh/id_deploy -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          PSQL="docker exec techfeed-postgres psql -U techfeed -d techfeed -c"
          $SSH_CMD "$PSQL \"CREATE TABLE IF NOT EXISTS users (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), email VARCHAR UNIQUE NOT NULL, password VARCHAR, name VARCHAR, google_id VARCHAR UNIQUE, fcm_token VARCHAR, created_at TIMESTAMPTZ DEFAULT now());\""
          $SSH_CMD "$PSQL \"ALTER TABLE users ADD COLUMN IF NOT EXISTS name VARCHAR;\""
          $SSH_CMD "$PSQL \"ALTER TABLE users ADD COLUMN IF NOT EXISTS google_id VARCHAR UNIQUE;\""
          $SSH_CMD "$PSQL \"ALTER TABLE users ALTER COLUMN password DROP NOT NULL;\""
          $SSH_CMD "$PSQL \"ALTER TABLE users ADD COLUMN IF NOT EXISTS is_premium BOOLEAN DEFAULT false;\""
          $SSH_CMD "$PSQL \"ALTER TABLE users ADD COLUMN IF NOT EXISTS agreed_terms_at TIMESTAMPTZ;\""
          $SSH_CMD "$PSQL \"ALTER TABLE users ADD COLUMN IF NOT EXISTS reset_token VARCHAR;\""
          $SSH_CMD "$PSQL \"ALTER TABLE users ADD COLUMN IF NOT EXISTS reset_token_expires TIMESTAMPTZ;\""
          $SSH_CMD "$PSQL \"CREATE TABLE IF NOT EXISTS subscriptions (id SERIAL PRIMARY KEY, tag VARCHAR NOT NULL, user_id UUID REFERENCES users(id) ON DELETE CASCADE, UNIQUE(user_id, tag));\""
          $SSH_CMD "$PSQL \"CREATE TABLE IF NOT EXISTS bookmarks (id SERIAL PRIMARY KEY, content_id VARCHAR NOT NULL, created_at TIMESTAMPTZ DEFAULT now(), user_id UUID REFERENCES users(id) ON DELETE CASCADE, UNIQUE(user_id, content_id));\""
          $SSH_CMD "$PSQL \"ALTER TABLE bookmarks ADD COLUMN IF NOT EXISTS status VARCHAR;\""
          $SSH_CMD "$PSQL \"ALTER TABLE bookmarks ADD COLUMN IF NOT EXISTS content_type VARCHAR;\""
          $SSH_CMD "$PSQL \"ALTER TABLE bookmarks ADD COLUMN IF NOT EXISTS job_status VARCHAR;\""
